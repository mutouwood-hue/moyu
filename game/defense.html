<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摸鱼防线</title><link rel="stylesheet" href="defense.css"></head><body>
<main id="app"><section id="lobby"><header><div><small>摸鱼乐园 · DEFENSE</small><h1>摸鱼防线</h1></div><div class="wallet">◎ <b id="supply">0</b> 补给币<br><small>摸鱼币 <b id="fishCoins">0</b></small></div></header><div class="hero"><img src="defense-assets/soldier-clean.png" alt="蓝军士兵"><div><b>守住下班的路</b><p>带上小队，突破尸潮。</p><button id="continueRun" hidden>继续已付费的战斗</button><button id="start">开始战斗</button></div></div><div class="economy"><button id="exchange">1 摸鱼币 → 100 补给币</button><small>每次开局消耗 1 摸鱼币 · 主线移动操作满 10 秒后胜利奖励 12、失败奖励 6 摸鱼币；无尽每 10 秒移动奖励 1 摸鱼币，每局最多计算 60 分钟</small></div><div id="lobbyNotice" role="status"></div><nav><button data-page="levels">关卡</button><button data-page="tech">军队科技</button><button data-page="weapons">武器图鉴</button><button data-page="records">成就与纪录</button></nav><section id="page"></section><footer><label><input id="effects" type="checkbox"> 音效</label><label><input id="music" type="checkbox"> 音乐</label><span id="shortcutHint">A/D 或方向键移动 · 鼠标拖动 · ESC 暂停</span></footer></section>
